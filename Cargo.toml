[package]
name = "visorcam"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Visualizador de câmeras de segurança (rede local) para computador"

[[bin]]
name = "visorcam"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
md5 = "0.7"
openh264 = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
